<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Eliminar Venta</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container py-4" style="max-width: 500px;">
    <div class="card border-danger mt-5">
        <div class="card-header bg-danger text-white">
            <h4 class="m-0">Confirmar Eliminación</h4>
        </div>
        <div class="card-body">
            <p>¿Estás seguro/a de eliminar el registro de venta <strong>#{{ venta.id }}</strong> por ${{ venta.monto }}?</p>
            <form method="POST" class="d-flex justify-content-between mt-4">
                {% csrf_token %}
                <a href="{% url 'listar_ventas' %}" class="btn btn-secondary">Cancelar</a>
                <button type="submit" class="btn btn-danger">Eliminar</button>
            </form>
        </div>
    </div>
</body>
</html>
